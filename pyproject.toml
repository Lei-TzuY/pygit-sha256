[build-system]
requires      = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name            = "pygit"
version         = "0.1.0"
description     = "A minimal Git clone in Python (SHA-256, zlib, JSON index)"
requires-python = ">=3.9"

[project.scripts]
pygit = "pygit.application:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
